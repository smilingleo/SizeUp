# ClipShot's config.ini, as the Rust app writes it.
#
# A representative real file: the three capture hotkeys, two of them rebound
# from the defaults, plus a login checkbox the importer ignores. This is what
# `ClipShotImporterTests` reads, so the parser is checked against the format
# the Rust `config.rs` actually produces (`key = "value"`, quoted, with the
# `#` comments above).
[hotkeys]
capture_hotkey="Ctrl+Cmd+A"
record_hotkey="Ctrl+Cmd+Z"
scroll_capture_hotkey="Ctrl+Cmd+S"

[settings]
auto_start_login=false
